name: Database Maintenance

on:
  schedule:
    # Hourly at :20, NOT every 6 hours.
    #
    # The sweeps are bounded per run (500 rows each — see migration 055), so
    # cadence is what provides capacity: 12,000 rows/day against a steady-state
    # need of ~2,000. Six-hourly with a bound this small could not keep up.
    #
    # Small-and-frequent also beats large-and-rare on this table. Every row
    # rewritten leaves a dead entry in three partial `is_active` indexes, and
    # bulk-updating thousands in one go degrades read latency until autovacuum
    # catches up (measured 2026-08-17: a feed-shaped query went to 4.9s after
    # ~900 rows were rewritten in a tight loop). Hourly batches give autovacuum
    # an hour to keep pace.
    #
    # :20 deliberately avoids ingest.yml at :07 and :37 — concurrent bulk writes
    # on `articles` contend for the same indexes.
    - cron: '20 * * * *'
  workflow_dispatch:

  # External trigger, mirroring ingest.yml's `external-cron`. GitHub disables
  # scheduled workflows after 60 days of repo inactivity — which is what killed
  # ingestion 2026-08-12 to 2026-08-16 — and even when enabled the schedule is
  # best-effort and often runs late. cron-job.org fires this instead, so the
  # sweep does not depend on GitHub's scheduler being awake.
  repository_dispatch:
    types: [maintenance-cron]

# Two independent triggers can now fire this, so make sure they never overlap.
# Concurrent runs are not dangerous — the sweeps are bounded and idempotent, and
# a second run would block on row locks and then find those rows no longer match
# — but they would contend for the same indexes on `articles` for no benefit.
# Queue instead of cancelling: a cancelled run's UPDATE rolls back and makes no
# progress, so finishing the one in flight is always better.
concurrency:
  group: db-maintenance
  cancel-in-progress: false

jobs:
  cleanup:
    name: Expire old articles
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Deactivate expired articles
        run: |
          # Strip any trailing slash from APP_URL. A double slash is survivable
          # (Vercel 308s //api/... to /api/...) but costs -L an extra round trip
          # on every run. Mirrors ingest.yml.
          APP_URL="${{ secrets.APP_URL }}"
          APP_URL="${APP_URL%/}"

          echo "Running DB cleanup at $(date -u)"
          echo "Endpoint: ${APP_URL}/api/maintenance/cleanup"

          # Deliberately NOT `curl -f`. --fail exits 22 and prints nothing,
          # which is exactly how this job failed on 2026-08-17: the log showed
          # an exit code and no way to tell a 401 from a 504 from a 500. Capture
          # the status and the body, print both, then decide.
          #
          # -L matters: the apex host 308-redirects to www, so without it curl
          # treats the 308 as a successful response and never calls the endpoint.
          #
          # --max-time 120 is deliberately longer than the route's
          # maxDuration = 60, so that if the function does time out we receive
          # and log Vercel's 504 instead of curl aborting first and hiding it.
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X POST \
            -L \
            "${APP_URL}/api/maintenance/cleanup" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            --max-time 120)

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)

          echo "HTTP status: $HTTP_CODE"
          echo "Response: $BODY"

          # The route returns 500 with a `failures` array when any individual
          # step fails, so this catches a partial sweep too — it used to answer
          # 200 even when every step had errored.
          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "❌ Cleanup failed with status $HTTP_CODE"
            exit 1
          fi

          echo "✅ Cleanup complete"
